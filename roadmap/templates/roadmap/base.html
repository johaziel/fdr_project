<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Feuilles de route{% endblock %}</title>
  <style>
    :root { --ink:#1d1d1f; --muted:#6b7280; --line:#d9dce1; --accent:#1f4e79; --bg:#f5f6f8; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: var(--ink);
           background: var(--bg); margin: 0; line-height: 1.4; font-size: 11px; }
    .page { max-width: 900px; margin: 0 auto; padding: 15px; background: #fff; }
    .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .logo { max-height: 80px; max-width: 200px; object-fit: contain; }
    h1 { font-size: 20px; margin: 0 0 4px; color: var(--accent); }
    h2 { font-size: 14px; margin: 12px 0 6px; padding-bottom: 4px; color: var(--accent);
         border-bottom: 2px solid var(--accent); text-transform: uppercase; letter-spacing: .04em; }
    h3 { font-size: 12px; margin: 10px 0 6px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
    th, td { text-align: left; padding: 3px 5px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); }
    .meta { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; margin: 12px 0; }
    .meta dt { color: var(--muted); }
    .meta dd { margin: 0; font-weight: 500; }
    .note { white-space: pre-line; color: var(--muted); font-size: 10px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
    .btn { display: inline-block; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; text-decoration: none; font-size: 14px; cursor: pointer; }
    .btn.secondary { background: #fff; color: var(--accent); }
    section { break-inside: avoid; }
    .day { font-weight: 600; background: #eef2f7; }
    .table-wrap { overflow-x: auto; }
    .text-center {text-align: center;}
    th.empty { border-bottom: 0px;}
    .r-border{ border-right: 1px solid var(--line);}
    .l-border{ border-left: 1px solid var(--line);}
    @media print {
      @page { size: A4; margin: 14mm; }
      body { background: #fff; font-size: 11pt; }
      .page { max-width: none; padding: 0; }
      .no-print { display: none !important; }
      h2 { break-after: avoid; }
      tr { break-inside: avoid; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="page">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
